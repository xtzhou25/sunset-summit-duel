<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Livehouse v7 directional rotation probe</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#10131c;color:#edf2ff;font:14px system-ui,sans-serif}body.host{padding:12px}h1{font-size:19px;margin:0 0 5px}p{margin:5px 0 10px}.host-grid{display:flex;gap:18px;align-items:flex-start}.controls{width:460px;flex:0 0 460px}.host button{padding:9px 12px;margin:3px;border:1px solid #7a86a0;border-radius:6px;background:#293450;color:white;cursor:pointer}.host button:focus{outline:3px solid #ffd166}.host pre{white-space:pre-wrap;word-break:break-word;font:12px/1.4 ui-monospace,monospace;max-height:660px;overflow:auto;background:#182032;padding:10px;border-radius:7px}.host iframe{box-sizing:content-box;display:block;flex:none;width:390px;height:680px;border:2px solid #8493b8;background:#0b0913}.badge{color:#ffd166}.embedded{width:100%;height:100%;overflow:hidden}.embedded #canvas{display:block;outline:none}.embedded #display-toolbar{font-size:11px}
</style></head><body><script>
'use strict';
const params=new URLSearchParams(location.search);
if(!params.has('embed')){
 document.body.className='host';
 document.body.innerHTML='<h1>Livehouse v7 directional rotation probe</h1><p class="badge">Exact production shell/callbacks + 2D MOCK HUD. NOT Godot gameplay or iPhone Safari.</p><div class="host-grid"><div class="controls"><p>Enable page landscape inside the frame. Click UP, DOWN, both diagonals and five actions. Drag inside/outside the continuous pad. Trusted mouse and synthetic touch are reported separately.</p><div><button data-size="390,844">390 × 844 portrait</button><button data-size="390,680">390 × 680 address-bar simulation</button><button data-size="844,390">844 × 390 landscape</button><button data-size="320,568">320 × 568 compact</button></div><div><button id="synthetic">Run SYNTHETIC regression</button><button id="arm">Arm SYNTHETIC cancel test</button><button id="reset">Reset probe counters</button></div><p>After arming, click the real page-mode button or resize the iframe. The production shell must release all held sources and suppress stale tails.</p><p id="summary" class="badge">Waiting for checks…</p><pre id="report">Waiting for embedded probe…</pre></div><iframe title="Production shell input probe" id="probe" src="?embed=1" allow="fullscreen \'none\'"></iframe></div>';
 const iframe=document.querySelector('iframe'),report=document.querySelector('#report');let latest=null;
 function show(){if(!latest)return;const r=iframe.getBoundingClientRect();const centers=Object.fromEntries(Object.entries(latest.centers||{}).map(([k,v])=>[k,[Math.round(v[0]+r.left+2),Math.round(v[1]+r.top+2)]]));report.textContent=JSON.stringify({...latest,screenTargetCenters:centers},null,2);document.querySelector('#summary').textContent='SYNTHETIC: '+(latest.syntheticResult?latest.syntheticResult.pass?'PASS '+latest.syntheticResult.checks.length+' checks':'FAIL':'not run')+' | MODE CANCEL: '+(latest.cancelResult?latest.cancelResult.armed?'ARMED':latest.cancelResult.pass?'PASS':'FAIL':'not run')+' | MOCK held: '+(latest.mockHud?.held?.join(', ')||'none');}
 document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{const [w,h]=b.dataset.size.split(',');iframe.style.width=w+'px';iframe.style.height=h+'px';show();});
 for(const command of ['synthetic','arm','reset'])document.querySelector('#'+command).onclick=()=>iframe.contentWindow.postMessage({command},location.origin);
 addEventListener('message',e=>{if(e.source===iframe.contentWindow&&e.data?.probe){latest=e.data.probe;show();}});
}else{
 document.body.className='embedded';
 const css=document.createElement('link');css.rel='stylesheet';css.href='../web-ui/fullscreen.css?probe='+Date.now();document.head.append(css);
 document.body.innerHTML='<main id="game-shell"><header id="display-toolbar"><p id="display-status"></p><button id="page-landscape-button" type="button">页面内横屏</button><button id="fullscreen-button" type="button">系统全屏</button></header><section id="game-stage"><div id="canvas-frame"><canvas id="canvas" tabindex="0" aria-label="2D directional input probe, not actual game"></canvas></div></section></main>';
 const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
 const names=['LEFT','RIGHT','UP','DOWN','UP-LEFT','UP-RIGHT','DOWN-LEFT','DOWN-RIGHT','NEUTRAL','PUNCH','KICK','HEAVY','ROUNDHOUSE','SPECIAL'];
 const padPoints=[[.1,.5],[.9,.5],[.5,.1],[.5,.9],[.1,.1],[.9,.1],[.1,.9],[.9,.9],[.5,.5]];
 const counts={};let active=new Map(),realEvents=[],syntheticResult=null,cancelResult=null,cancelArmed=null,cancelCount=0,exactRuntime=null,model=null,lastRect='',sequence=0;
 function layout(){const w=canvas.width,h=canvas.height,side=Math.max(56,Math.min(136,w*.24,h*.38)),pad={x:w*.045,y:h*.66-side*.5,w:side,h:side};const left=w*.35,gap=w*.014,bw=(w*.61-gap*4)/5,bh=Math.min(62,h*.24);return {pad,attacks:['punch','kick','heavy','roundhouse','special'].map((name,i)=>({name,x:left+i*(bw+gap),y:h*.66-bh*.5,w:bw,h:bh}))};}
 function targets(){const l=layout();return padPoints.map((p,i)=>({name:names[i],x:l.pad.x+l.pad.w*p[0],y:l.pad.y+l.pad.h*p[1]})).concat(l.attacks.map(r=>({name:r.name.toUpperCase(),x:r.x+r.w*.5,y:r.y+r.h*.5})));}
 function position(e){const r=canvas.getBoundingClientRect(),hook=window.LivehouseCanvasInput?.position(canvas,e,r);return hook||[(e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height];}
 function movement(e){const r=canvas.getBoundingClientRect(),hook=window.LivehouseCanvasInput?.movement(canvas,e,r);return hook||[e.movementX*canvas.width/r.width,e.movementY*canvas.height/r.height];}
 function hit(p){return model?.hit(p)||null;}
 function record(e,phase){const p=position(e),name=hit(p);if(phase==='down'){active.set(e.pointerId,{name,p});if(name&&e.isTrusted)counts[name]=(counts[name]||0)+1;try{canvas.setPointerCapture(e.pointerId);}catch(_){}}else if(phase==='move'&&active.has(e.pointerId)){active.set(e.pointerId,{name,p});}else if(phase==='up'||phase==='cancel')active.delete(e.pointerId);if(e.isTrusted&&(phase!=='move'||e.buttons)){realEvents.push({seq:++sequence,type:e.type,trusted:e.isTrusted,pointerType:e.pointerType,client:[e.clientX,e.clientY],mapped:p.map(v=>+v.toFixed(2)),movement:movement(e).map(v=>+v.toFixed(2)),hit:name,active:active.size});realEvents=realEvents.slice(-32);}render();publish();}
 ['pointerdown','pointermove','pointerup','pointercancel'].forEach(type=>canvas.addEventListener(type,e=>record(e,({pointerdown:'down',pointermove:'move',pointerup:'up',pointercancel:'cancel'})[type])));
 function render(){ctx.fillStyle='#151b2d';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#eef2ff';ctx.font='bold 16px system-ui';ctx.textAlign='left';ctx.fillText('V7 CONTINUOUS PAD / MOCK HUD',14,28);ctx.font='11px system-ui';ctx.fillText('Exact shell + JS callbacks; no WASM, no physical multi-touch.',14,47);const l=layout(),held=model?.report().held||[];ctx.fillStyle='#345479';ctx.fillRect(l.pad.x,l.pad.y,l.pad.w,l.pad.h);for(const t of targets().slice(0,9)){ctx.fillStyle=t.name==='NEUTRAL'?'#b9c3d0':'#e8f3ff';ctx.beginPath();ctx.arc(t.x,t.y,Math.max(5,l.pad.w*.055),0,Math.PI*2);ctx.fill();ctx.font='9px system-ui';ctx.textAlign='center';ctx.fillText(t.name,t.x,t.y+17);}for(const a of l.attacks){ctx.fillStyle=held.includes(a.name)?'#ffe273':'#b790e3';ctx.fillRect(a.x,a.y,a.w,a.h);ctx.fillStyle='#10131c';ctx.font='bold 9px system-ui';ctx.textAlign='center';ctx.fillText(a.name.toUpperCase(),a.x+a.w/2,a.y+a.h/2+3);}ctx.textAlign='left';ctx.fillStyle='#ffe273';ctx.font='12px system-ui';ctx.fillText('MOCK held: '+held.join(', '),14,canvas.height-16);for(const a of active.values()){ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(a.p[0],a.p[1],12,0,Math.PI*2);ctx.stroke();}}
 function clientFor(p){const r=canvas.getBoundingClientRect();return window.LivehouseDisplay?.rotated?[r.right-p[1]*r.width/canvas.height,r.top+p[0]*r.height/canvas.width]:[r.left+p[0]*r.width/canvas.width,r.top+p[1]*r.height/canvas.height];}
 function publish(){const r=canvas.getBoundingClientRect();parent.postMessage({probe:{source:'Production RC6 shell + exact dist/index.js callbacks; MOCK HUD; no WASM/gameplay, no physical iPhone',viewport:[innerWidth,innerHeight],mode:{...(window.LivehouseDisplay||{})},pageButton:document.querySelector('#page-landscape-button').textContent,status:document.querySelector('#display-status').textContent,fullscreenEnabled:document.fullscreenEnabled,hookReady:!!window.LivehouseCanvasInput,canvasBacking:[canvas.width,canvas.height],canvasBounds:[r.left,r.top,r.width,r.height],trustedDownCounts:counts,activeCount:active.size,nativeCancelCalls:cancelCount,centers:Object.fromEntries(targets().map(t=>[t.name,clientFor([t.x,t.y])])),recentTrustedPointerEvents:realEvents,syntheticResult,cancelResult,mockHud:model?.report(),exactRuntime:exactRuntime?.report()}},location.origin);}
 function pt(name){const t=targets().find(t=>t.name===name);return [t.x,t.y];}
 function touch(id,p){const c=clientFor(p);return new Touch({identifier:id,target:canvas,clientX:c[0],clientY:c[1]});}
 const syntheticTouches=new Map();
 function fireTouch(type,changes){for(const t of changes){if(type==='touchend'||type==='touchcancel')syntheticTouches.delete(t.identifier);else syntheticTouches.set(t.identifier,t);}canvas.dispatchEvent(new TouchEvent(type,{bubbles:true,cancelable:true,touches:[...syntheticTouches.values()],targetTouches:[...syntheticTouches.values()],changedTouches:changes}));}
 function key(type,code,repeat=false){canvas.dispatchEvent(new KeyboardEvent(type,{key:code,code,repeat,bubbles:true,cancelable:true}));}
 function snapshot(){return {mock:model.report(),exact:exactRuntime.report()};}
 function heldIs(expected){return model.same(model.report().held.slice().sort(),expected.slice().sort());}
 function synthetic(){if(!exactRuntime)return;exactRuntime.reset();model.reset();syntheticTouches.clear();const checks=[];function check(name,ok){checks.push({name,pass:!!ok,state:snapshot()});}
  try{
   fireTouch('touchstart',[touch(7,pt('UP-LEFT'))]);check('one contact asserts left+jump',heldIs(['left','jump']));
   fireTouch('touchstart',[touch(19,pt('SPECIAL'))]);check('second contact holds special independently',heldIs(['left','jump','special']));
   fireTouch('touchmove',[touch(7,pt('UP-RIGHT'))]);check('diagonal drag changes direction without extra jump edge',heldIs(['right','jump','special'])&&model.report().edges.filter(e=>e.action==='jump'&&e.pressed).length===1);
   fireTouch('touchmove',[touch(7,pt('DOWN-RIGHT'))]);check('drag down changes jump to crouch with horizontal',heldIs(['right','crouch','special']));
   fireTouch('touchmove',[touch(7,pt('NEUTRAL'))]);check('neutral center releases only directions',heldIs(['special']));
   fireTouch('touchmove',[touch(7,pt('HEAVY'))]);check('owned pad contact never turns into attack',heldIs(['special'])&&model.report().contacts.some(c=>c.id===7&&c.kind==='direction'));
   fireTouch('touchmove',[touch(7,pt('UP-LEFT'))]);check('pad re-entry reacquires diagonal',heldIs(['left','jump','special']));
   fireTouch('touchcancel',[touch(19,pt('SPECIAL'))]);const canceled=exactRuntime.report().events.at(-1);check('cancel one attack releases at sentinel, diagonal remains',heldIs(['left','jump'])&&canceled.values[0].x===-1000000&&canceled.values[0].y===-1000000);
   fireTouch('touchstart',[touch(103,pt('LEFT'))]);fireTouch('touchend',[touch(7,pt('UP-LEFT'))]);check('shared direction stays held until last contact ends',heldIs(['left']));
   key('keydown','ArrowLeft');fireTouch('touchend',[touch(103,pt('LEFT'))]);check('keyboard survives touch release of same direction',heldIs(['left']));
   fireTouch('touchstart',[touch(4,pt('LEFT'))]);key('keyup','ArrowLeft');check('touch survives keyboard release of same direction',heldIs(['left']));
   fireTouch('touchend',[touch(4,pt('LEFT'))]);check('all contacts and keyboard release cleanly',heldIs([])&&exactRuntime.report().heldTouch.length===0&&exactRuntime.report().heldKeys.length===0);
   for(const name of ['UP','DOWN','PUNCH','KICK','HEAVY','ROUNDHOUSE','SPECIAL']){fireTouch('touchstart',[touch(55,pt(name))]);check(name+' maps through exact callback',heldIs([({UP:'jump',DOWN:'crouch'})[name]||name.toLowerCase()]));fireTouch('touchend',[touch(55,pt(name))]);}
   syntheticResult={label:'SYNTHETIC untrusted DOM events through exact exported callbacks into MOCK HUD; NOT physical touch or gameplay',pass:checks.every(c=>c.pass),checks};
  }catch(e){syntheticResult={label:'SYNTHETIC execution error',pass:false,error:String(e),checks};}finally{canvas.__livehouseCancelInput();syntheticTouches.clear();}render();publish();
 }
 function arm(){exactRuntime.reset();model.reset();syntheticTouches.clear();fireTouch('touchstart',[touch(91,pt('UP-LEFT')),touch(19,pt('SPECIAL'))]);key('keydown','ArrowRight');cancelArmed={before:snapshot(),mode:{...window.LivehouseDisplay},touches:[...syntheticTouches.values()]};cancelResult={label:'SYNTHETIC holds awaiting a real production shell mode/size cancellation',armed:true,before:cancelArmed.before};publish();}
 function afterCancel(){cancelCount++;active.clear();if(cancelArmed){const a=cancelArmed;cancelArmed=null;const released=snapshot();const n=exactRuntime.report().events.length;fireTouch('touchmove',a.touches);key('keydown','ArrowRight',true);fireTouch('touchend',a.touches);key('keyup','ArrowRight');const tail=snapshot();cancelResult={label:'Synthetic held sources; cancellation invoked by real production shell. No hardware touch claim.',armed:false,pass:released.mock.held.length===0&&released.exact.heldTouch.length===0&&released.exact.heldKeys.length===0&&tail.mock.held.length===0&&tail.exact.events.length===n,before:a.before,released,staleTail:tail};syntheticTouches.clear();}render();publish();}
 addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent)return;if(e.data?.command==='synthetic')synthetic();if(e.data?.command==='arm')arm();if(e.data?.command==='reset'){for(const n in counts)delete counts[n];realEvents=[];syntheticResult=null;cancelResult=null;cancelArmed=null;if(exactRuntime)exactRuntime.reset();model?.reset();render();publish();}});
 function load(src){return new Promise(resolve=>{const s=document.createElement('script');s.src=src+'?probe='+Date.now();s.onload=resolve;document.body.append(s);});}
 (async()=>{await load('../web-ui/fullscreen.js');await load('browser_directional_fixture.js');model=LivehouseDirectionalFixture.create(layout);await load('browser_runtime_input_probe.js');exactRuntime=window.installLivehouseExactRuntimeProbe({canvas,hit,oninput:e=>model.input(e),onchange:()=>{render();publish();}});const cancelExact=canvas.__livehouseCancelInput;canvas.__livehouseCancelInput=()=>{const count=cancelExact();afterCancel();return count;};render();publish();})();
 function monitor(){const r=canvas.getBoundingClientRect();const snapshot=[canvas.width,canvas.height,r.left,r.top,r.width,r.height,document.querySelector('#page-landscape-button').textContent,document.querySelector('#display-status').textContent].join();if(snapshot!==lastRect){lastRect=snapshot;render();publish();}requestAnimationFrame(monitor);}requestAnimationFrame(monitor);
}
</script></body></html>
